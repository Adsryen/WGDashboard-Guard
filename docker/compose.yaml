services:
  wgdashboard:
    image: ${WGD_IMAGE:-wgdashboard-guard:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    container_name: ${WGD_CONTAINER_NAME:-wgdashboard}
    environment:
      TZ: ${TZ:-UTC}
      wgd_port: ${WGD_PORT:-10086}
      wg_autostart: ${WG_AUTOSTART:-wg0}
      public_ip: ${PUBLIC_IP:-}
      username: ${WGD_USERNAME:-}
      password: ${WGD_PASSWORD:-}
      enable_totp: ${WGD_ENABLE_TOTP:-}
      dynamic_config: ${WGD_DYNAMIC_CONFIG:-true}
    ports:
      - ${WGD_HTTP_PORT:-10086}:${WGD_PORT:-10086}/tcp
      - ${WG_PORT:-51820}:${WG_PORT:-51820}/udp
    volumes:
      - aconf:/etc/amnezia/amneziawg
      - conf:/etc/wireguard
      - data:/data
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${wgd_port:-10086}/api/handshake >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  aconf:
  conf:
  data:
